# Egress proxy (ADR-013). Controls destination hosts, ports and addresses. It cannot see HTTPS methods or
# paths: those are enforced in the browser. Deny by default.
http_port 3128
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 seconds
pid_filename /tmp/squid.pid
access_log /tmp/access.log
cache_log /tmp/cache.log

# The local fixture: built in, on its own ports.
acl fixture_hosts dstdomain -n "/etc/squid/allowed-hosts.txt"
acl fixture_ports port 80 443 8090
acl allowed_hosts dstdomain -n "/etc/squid/allowed-hosts.txt"
acl private_approved dstdomain -n "/etc/squid/private-approved.txt"
# Real hosts an operator approved, each on its own port, generated at start from /etc/qa/approved-hosts.txt by
# qa-entrypoint.sh. Each adds to allowed_hosts and gets its own host-and-port rule below.
include /tmp/qa-approved-acls.conf
# Targets are named hosts. A raw IP is refused outright, with no reverse lookup.
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^[[]

acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private dst ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny ip_literal
# Refused before any DNS lookup: a name nobody approved is never resolved.
http_access deny !allowed_hosts
# Checked after DNS, so an approved name that resolves to a private address is refused.
http_access deny to_private !private_approved
http_access allow fixture_hosts fixture_ports
include /tmp/qa-approved-rules.conf
http_access deny all
